<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    body {
      background-color: black;
    }

    .flag {
      height: 400px;
      width: 600px;
      margin-left: 50px;
      margin-top: 50px;
      background-color: brown;
      border: 7px solid white;
    }

    /*black text*/
    .flag div > p {
      text-align: center;
      font-size: 50px;
      color: black;
      margin-top: 20px;
      margin-bottom: 0;
      margin-top: 9px;
    }

    .flag > p {
      font-size: 50px;
      color: white;
      margin-top: 10px;
      margin-bottom: 0;
      text-align: center;
    }

    /*purple area in middle*/
    .flag > div {
      margin-top: 25px;
      background-color: purple;
      height: 200px;
      width: 600px;
    }
    /*white area in middle*/
    .flag > div > div {
      background-color: white;
      height: 140px;
      width: 140px;
      border-radius: 50%;
      margin-left: 200px;
      margin-top: 20px;
      position: fixed;
      }

  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
