<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    body {
      background-color: black;
    }

    .flag {
         width: 900px;
         height: 600px;
      background-color: #ce1126;
      border: 7px solid white;
      position: relative;
       } 
    
    /*purple area in middle*/
    .flag > div {
      width: 100%;
      height: 300px;
      background-color: navy;
      top: 150px;
      position: absolute;

    }

        /*white area in middle*/
      .flag > div > div {
        width: 200px;  
        height: 200px;
        background-color: white;
        border-radius: 50%;
        margin-left: 350px;
        top: 50px;
        position: relative;
        }

    /*black text*/
    .flag div > p {
      text-align: center;
      font-size: 5rem;
      color: black;
      margin: 0;
    }
      

    /*text in circle*/
    .flag > p {
      font-size: 5rem;
      color: white;
      margin: 0;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
